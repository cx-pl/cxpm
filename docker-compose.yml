services:
  cxpm-web:
    build:
      context: .
      dockerfile: Cxpm.Web/Dockerfile
    ports:
      - "8181:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RepositoryStorage__Path: /var/lib/cxpm/packages
      CXPM_TOKEN: ${CXPM_TOKEN:-}
    volumes:
      - cxpm-packages:/var/lib/cxpm
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  cxpm-packages:
